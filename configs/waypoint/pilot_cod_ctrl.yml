model:
  channels: 64

  ####
  n_layers: 16
  n_heads: 24
  n_kv_heads: 12
  d_model: 1536
  mlp_ratio: 4

  gradient_checkpointing: false
  ####

  tokens_per_frame: 256
  height: 16
  width: 16
  patch: [1, 1]

  base_fps: 60  # FPS must be divisible by this. atomic time unit is 1/base_fps
  local_window: 8
  global_window: 32
  global_attn_period: 2

  n_frames: 512  # num RoPE cached frames, doesn't impact model behavior

  rope_impl: motion

  sink_attn: false
  gated_attn: true

  noise_conditioning: wan

  n_controller_inputs: 258

  cfg_prob: 0.1  # TODO: implement, currently unused

  text_conditioning: null
  ctrl_conditioning: cross_attention_same_frame


train:
  trainer_id: world

  noise_prev: 0.2
  image_only_warmup: null
  bidirectional_warmup: null

  total_accum_steps: 8

  epochs: 10000

  opt: Muon
  opt_kwargs:
    lr: 1.0e-3
    momentum: 0.95
    weight_decay: 1.0e-2
    adamw_lr: 1.0e-4
    adamw_wd: 1.0e-2
    adamw_eps: 1.0e-6
    adamw_betas: [0.9, 0.95]
    adamw_keys: [patchify, unpatchify, _emb, cond_proj, out_norm, gate_proj, null_prompt, prompt_proj]

  scheduler: null

  checkpoint_dir: /mnt/data/waypoint_1/checkpoints/pilot_stage0/${oc.env:RUN_NAME}
  output_path: /mnt/data/waypoint_1/models/pilot_stage0/${oc.env:RUN_NAME}
  resume_ckpt: null

  sample_interval: 5000
  save_interval: 10000

  vae_id: null
  vae_batch_size: 4

  vae_scale: 0.7
  vae_cfg_path: /mnt/data/shahbuland/owl-vaes/configs/waypoint_1/wp1_depth.yml
  vae_ckpt_path: /mnt/data/shahbuland/owl-vaes/checkpoints/waypoint_1_vae_owlc_depth/step_390000.pt

  prompt_encoder_model_id: google/umt5-xl

  wandb_watch: false

  data_id: multi
  data_kwargs:
    defaults:
      batch_size: 1
      seq_len: 64
      batch_columns: ["depthlatent", "fps", "mouse", "button"]
      latent_column: "depthlatent"
      sampling_periods: [1]
      legal_fps: [60]
    loaders:
      - data_id: sequence_packing
        data_kwargs:
          dataset_path: /mnt/data/lapp0/BlackOpsColdWar_npy/train
          sampling_periods: [1]

  n_eval_loss_samples: 8192
  eval_data_id: multi
  eval_data_kwargs:
    defaults:
      batch_size: 1
      seq_len: 192
      batch_columns: ["depthlatent", "fps", "mouse", "button"]
      latent_column: "depthlatent"
      sampling_periods: [1]
      legal_fps: [60]
    loaders:
      - data_id: cod
        data_kwargs:
          dataset_path: /mnt/data/lapp0/BlackOpsColdWar_npy/eval
          sampling_periods: [1]

  sample_data_id: multi
  sample_data_kwargs:
    defaults:
      batch_size: 1
      seq_len: 512
      batch_columns: ["depthlatent", "fps", "mouse", "button", "sample_rel_path"]
      latent_column: "depthlatent"
      sampling_periods: [1]
      legal_fps: [60]
    loaders:
      - data_id: cod
        data_kwargs:
          dataset_path: /mnt/data/lapp0/BlackOpsColdWar_npy/eval
          sampling_periods: [1]

  sampler_id: standard
  sampler_kwargs:
    n_steps: 20
    cfg_scale: 1.0
    only_return_generated: false

  sampling_batch_size: 1  # TODO: doesn't work
  n_samples: 16  # TODO: this doesn't work, we always do 1 sample per GPU

  samplers:
    prefix_30:
      num_seed_frames: 100
      num_generated_frames: 300

wandb:
  name: wayfarerlabs
  project: waypoint_pilot
  run_name: ${oc.env:RUN_NAME}
