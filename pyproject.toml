[project]
name            = "owl-wms"
version         = "0.1.0"
description     = "Basic world models "
readme          = "README.md"
requires-python = ">=3.11"
dependencies    = ["numpy>=2.3.4", "xlib>=0.21"]

[project.optional-dependencies]

# -- accelerators --
cuda = [
    "torch",
    "torchvision",
    "triton ; sys_platform != 'win32' and sys_platform != 'darwin'",
    "triton-windows ; sys_platform == 'win32'",
]

cpu  = ["torch", "torchvision"]
xpu  = ["torch", "torchvision"]
mps  = ["torch", "torchvision"]
rocm = ["torch", "torchvision"]

[tool.uv]
prerelease = "allow"
preview    = true

conflicts = [
    [
        { extra = "mps" },
        { extra = "cuda" },
        { extra = "xpu" },
        { extra = "torch" },

    ],
]

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name     = "pytorch-rocm"
url      = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name     = "pytorch-xpu"
url      = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torchaudio = [
    { index = "pytorch-cpu", extra = "mps", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'Linux'" },
]

torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

torch = [
    { index = "pytorch-cpu", extra = "mps", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'Linux'" },

]
